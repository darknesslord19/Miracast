name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk EkranYansit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EkranYansit-apk
          path: EkranYansit.apk

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ekran Yansıt v1.0.${{ github.run_number }}
          body: "Telefon ve Android TV'ye aynı APK kurulur. TV'de uygulama otomatik alıcı modunda açılır."
          files: EkranYansit.apk
          make_latest: true
